<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="100%" role="img" aria-label="Prajithaa Parani — AI/ML Engineer">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F7FF">
        <animate attributeName="stop-color" values="#00F7FF;#7C3AED;#FF2E88;#00F7FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#FF2E88;#00F7FF;#7C3AED" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF2E88">
        <animate attributeName="stop-color" values="#FF2E88;#00F7FF;#7C3AED;#FF2E88" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F7FF"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1c2636" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="900" height="270" rx="16" fill="#0d1117"/>
  <rect width="900" height="270" rx="16" fill="url(#grid)" opacity="0.55"/>

  <!-- floating particles -->
  <g fill="#00F7FF">
    <circle cx="80" cy="220" r="3" opacity="0.7">
      <animate attributeName="cy" values="240;30" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="200" r="2" opacity="0.5">
      <animate attributeName="cy" values="250;20" dur="12s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="12s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="230" r="3" opacity="0.6" fill="#7C3AED">
      <animate attributeName="cy" values="245;25" dur="10s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="10s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="210" r="2" opacity="0.5" fill="#FF2E88">
      <animate attributeName="cy" values="255;40" dur="13s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="13s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="240" r="2" opacity="0.4" fill="#7C3AED">
      <animate attributeName="cy" values="260;35" dur="11s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="11s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- terminal prompt decoration -->
  <text x="70" y="78" font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="16" fill="#3fb950">➜</text>
  <text x="92" y="78" font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="16" fill="#8b949e">~/prajithaa</text>
  <text x="196" y="78" font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="16" fill="#e6edf3">whoami</text>

  <!-- name -->
  <text x="450" y="145" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif"
        font-size="52" font-weight="800" letter-spacing="2" fill="url(#nameGrad)" filter="url(#glow)">
    PRAJITHAA PARANI
  </text>

  <!-- rotating role lines -->
  <g font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="19" text-anchor="middle" fill="#e6edf3">
    <text x="450" y="190" opacity="0">
      AI/ML Engineer · Building Intelligent Agents
      <animate attributeName="opacity" values="0;1;1;0;0;0;0" keyTimes="0;0.05;0.28;0.33;0.34;0.9;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="190" opacity="0">
      Automation Pipelines · Multi-Agent Systems
      <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.33;0.38;0.43;0.61;0.66;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="190" opacity="0">
      Cloud-Native AI · GCP · AWS · Azure
      <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.66;0.71;0.76;0.94;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- blinking cursor -->
  <rect x="726" y="176" width="10" height="18" fill="#00F7FF">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- pulsing accent line -->
  <rect x="150" y="222" width="600" height="3" rx="1.5" fill="url(#lineGrad)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
